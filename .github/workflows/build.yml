name: Build & Release

on:
  push:
    #branches: [main]
    tags: ['v*']
  pull_request:
    #branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 打标签时需要写权限创建 Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 直接以 tag 为准把版本号写入 package.json（wxt 构建时读取它生成
      # manifest.version 和 zip 文件名），不再要求手动同步 package.json
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::标签 ${GITHUB_REF_NAME} 不是有效的 semver，期望格式 v1.2.3"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "本次构建版本：$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run compile

      # wxt zip 会先执行完整构建，再打包 .output/<name>-<version>-chrome.zip
      - name: Build & zip
        run: npm run zip

      # .output 是隐藏目录（点开头），upload-artifact / Release 的 glob
      # 默认会忽略隐藏目录导致 "No files were found"，这里先拷贝到普通目录
      - name: Collect artifacts
        run: |
          mkdir -p release
          cp .output/*.zip release/
          ls -la release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiModify-chrome
          path: release/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
